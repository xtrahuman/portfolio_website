<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>README.md — tochukwu-portfolio</title>
  <meta name="description" content="Tochukwu Okpara's portfolio as a code editor: README, about, skills and projects as files you can open, preview and run.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/switcher.css">
  <link rel="stylesheet" href="editor.css">
  <script type="module" src="editor.js"></script>
</head>
<body class="ed">
  <div class="ed-main">
    <aside class="ed-side" aria-label="Explorer">
      <h2>EXPLORER</h2>
      <ul class="tree" id="tree"></ul>
    </aside>
    <main class="ed-work">
      <div class="ed-tabs" id="tabs"></div>
      <div class="ed-bar" id="bar"></div>
      <div class="ed-view" id="view"></div>
      <div class="ed-out" id="out" hidden>
        <header>OUTPUT<button type="button" id="out-x" aria-label="Close output"></button></header>
        <pre id="out-pre"></pre>
      </div>
    </main>
  </div>
  <footer class="ed-status" id="status"></footer>
</body>
</html>
